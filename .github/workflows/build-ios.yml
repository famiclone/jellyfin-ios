name: Build Jellyfin Desktop iOS (.ipa)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build iPadOS 15+ arm64 IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen & CocoaPods if needed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

      - name: Cache CocoaPods (MobileVLCKit 3.6.0)
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: pods-mobilevlckit-3.6.0-${{ hashFiles('Podfile') }}

      - name: Generate Xcode project & install MobileVLCKit
        run: |
          xcodegen generate
          if [ -d "Pods/MobileVLCKit" ]; then
            pod install --no-repo-update
          else
            pod install --repo-update
          fi

      - name: Build Release arm64 (iOS 15.0 deployment target, unsigned)
        run: |
          xcodebuild build \
            -workspace JellyfinDesktop.xcworkspace \
            -scheme JellyfinDesktop \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa and .tipa
        run: |
          chmod +x scripts/package-ipa.sh
          ./scripts/package-ipa.sh build/DerivedData dist

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyfinDesktop-iPadOS15-IPA
          path: |
            dist/JellyfinDesktop-iOS15-unsigned.ipa
            dist/JellyfinDesktop-iOS15-TrollStore.tipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JellyfinDesktop-iOS15-unsigned.ipa
            dist/JellyfinDesktop-iOS15-TrollStore.tipa
          generate_release_notes: true
