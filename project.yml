name: JellyfinDesktop
options:
  bundleIdPrefix: org.jellyfin
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-ObjC"
      - "-lc++"
      - "-lxml2"
      - "-lz"
      - "-lbz2"
      - "-liconv"

targets:
  JellyfinDesktop:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: JellyfinDesktop/Sources
      - path: JellyfinDesktop/Assets.xcassets
      - path: JellyfinDesktop/LaunchScreen.storyboard
      - path: JellyfinDesktop/WebResources
        type: folder
        buildPhase: resources
    info:
      path: JellyfinDesktop/Info.plist
    settings:
      base:
        PRODUCT_NAME: JellyfinDesktop
        PRODUCT_BUNDLE_IDENTIFIER: org.jellyfin.desktop.ios
        MARKETING_VERSION: "1.12.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: JellyfinDesktop/JellyfinDesktop-Bridging-Header.h
        INFOPLIST_FILE: JellyfinDesktop/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: QuartzCore.framework
      - sdk: MediaPlayer.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: OpenGLES.framework
